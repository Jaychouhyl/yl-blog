<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">文章从 Markdown 到公开页面的内容链路</title>
  <desc id="desc">文章目录经过 loader、schema、公开过滤、聚合和静态路由，最终生成正文与索引页面。</desc>
  <rect width="1200" height="675" fill="#f5f2eb"/>
  <text x="64" y="82" fill="#22201d" font-family="Noto Serif SC, serif" font-size="32" font-weight="700">Content Collections 内容链路</text>
  <text x="64" y="116" fill="#7c756b" font-family="Arial, sans-serif" font-size="17">ONE SOURCE · MULTIPLE VIEWS</text>
  <g font-family="Noto Sans SC, Arial, sans-serif">
    <rect x="58" y="174" width="190" height="306" rx="20" fill="#fffdf9" stroke="#d8d1c4"/>
    <text x="90" y="220" fill="#22201d" font-size="23" font-weight="700">文章目录</text>
    <rect x="88" y="252" width="130" height="54" rx="8" fill="#eef3f8"/><text x="153" y="286" text-anchor="middle" fill="#2f526f" font-size="17">index.md</text>
    <rect x="88" y="324" width="130" height="54" rx="8" fill="#f7eded"/><text x="153" y="358" text-anchor="middle" fill="#814a4a" font-size="17">cover / 图示</text>
    <text x="90" y="420" fill="#7c756b" font-size="16">标题 · 日期 · 标签</text><text x="90" y="450" fill="#7c756b" font-size="16">分类 · 系列 · 草稿</text>
    <path d="M248 326 H310" stroke="#9b958b" stroke-width="4"/><polygon points="310,315 330,326 310,337" fill="#9b958b"/>
    <rect x="330" y="174" width="220" height="306" rx="20" fill="#22201d"/>
    <text x="440" y="220" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">集合入口</text>
    <rect x="362" y="254" width="156" height="56" rx="9" fill="#35322e" stroke="#716b62"/><text x="440" y="289" text-anchor="middle" fill="#f5f2eb" font-size="18">glob loader</text>
    <rect x="362" y="326" width="156" height="56" rx="9" fill="#35322e" stroke="#716b62"/><text x="440" y="361" text-anchor="middle" fill="#f5f2eb" font-size="18">Zod schema</text>
    <rect x="362" y="398" width="156" height="56" rx="9" fill="#35322e" stroke="#716b62"/><text x="440" y="433" text-anchor="middle" fill="#f5f2eb" font-size="18">draft 过滤</text>
    <path d="M550 326 H614" stroke="#9b958b" stroke-width="4"/><polygon points="614,315 634,326 614,337" fill="#9b958b"/>
    <rect x="634" y="174" width="220" height="306" rx="20" fill="#fffdf9" stroke="#d8d1c4"/>
    <text x="744" y="220" text-anchor="middle" fill="#22201d" font-size="23" font-weight="700">内容计算</text>
    <rect x="668" y="254" width="152" height="48" rx="24" fill="#edf5f1"/><text x="744" y="285" text-anchor="middle" fill="#356c58" font-size="17">日期排序</text>
    <rect x="668" y="320" width="152" height="48" rx="24" fill="#f5f0e8"/><text x="744" y="351" text-anchor="middle" fill="#775a31" font-size="17">标签 / 分类</text>
    <rect x="668" y="386" width="152" height="48" rx="24" fill="#f7eded"/><text x="744" y="417" text-anchor="middle" fill="#814a4a" font-size="17">系列顺序</text>
    <path d="M854 326 H918" stroke="#9b958b" stroke-width="4"/><polygon points="918,315 938,326 918,337" fill="#9b958b"/>
    <rect x="938" y="174" width="204" height="306" rx="20" fill="#3d6f9e"/>
    <text x="1040" y="220" text-anchor="middle" fill="#fff" font-size="23" font-weight="700">静态页面</text>
    <text x="1040" y="278" text-anchor="middle" fill="#eaf2f9" font-size="18">文章详情</text><text x="1040" y="322" text-anchor="middle" fill="#eaf2f9" font-size="18">时间轴</text><text x="1040" y="366" text-anchor="middle" fill="#eaf2f9" font-size="18">标签与分类</text><text x="1040" y="410" text-anchor="middle" fill="#eaf2f9" font-size="18">系列导航</text><text x="1040" y="454" text-anchor="middle" fill="#eaf2f9" font-size="18">RSS 与搜索</text>
  </g>
  <path d="M153 510 C153 576 1040 576 1040 510" fill="none" stroke="#c1b9ad" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="597" y="614" text-anchor="middle" fill="#7c756b" font-family="Noto Sans SC, Arial, sans-serif" font-size="18">一份正文只保存一次，不同页面按字段建立不同观察方式。</text>
</svg>
