<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">首页、内容索引与文章详情的阅读层级</title>
  <desc id="desc">首页使用全屏身份区，索引页使用短标题背景和两栏内容，文章页增加元信息、目录和连续正文。</desc>
  <rect width="1200" height="675" fill="#f5f2eb"/>
  <text x="64" y="80" fill="#22201d" font-family="Noto Serif SC, serif" font-size="32" font-weight="700">一套视觉语言，三种页面任务</text>
  <text x="64" y="114" fill="#7c756b" font-family="Arial, sans-serif" font-size="17">IDENTITY → DISCOVERY → READING</text>
  <g font-family="Noto Sans SC, Arial, sans-serif">
    <rect x="60" y="160" width="310" height="420" rx="24" fill="#151413"/>
    <rect x="82" y="184" width="266" height="34" rx="17" fill="#35322f" stroke="#6c665f"/><text x="215" y="207" text-anchor="middle" fill="#eee8de" font-size="15">居中导航</text>
    <text x="215" y="324" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="46">Yilin Blog</text>
    <text x="215" y="365" text-anchor="middle" fill="#d7d0c7" font-size="18">记录项目、琐碎、AI</text>
    <path d="M205 500 l10 12 10-12" fill="none" stroke="#d7d0c7" stroke-width="3"/>
    <text x="215" y="552" text-anchor="middle" fill="#a9a29a" font-size="16">首页 · 建立身份</text>
    <rect x="445" y="160" width="310" height="420" rx="24" fill="#fffdf9" stroke="#d8d1c4"/>
    <rect x="445" y="160" width="310" height="142" rx="24" fill="#2a2825"/><rect x="445" y="278" width="310" height="24" fill="#2a2825"/>
    <text x="600" y="242" text-anchor="middle" fill="#fff" font-family="Noto Serif SC, serif" font-size="34">时间轴</text>
    <rect x="466" y="326" width="82" height="224" rx="12" fill="#f1eee8"/><text x="507" y="360" text-anchor="middle" fill="#6f685f" font-size="15">作者</text><text x="507" y="392" text-anchor="middle" fill="#6f685f" font-size="15">公告</text><text x="507" y="424" text-anchor="middle" fill="#6f685f" font-size="15">最近文章</text>
    <line x1="588" y1="342" x2="718" y2="342" stroke="#c6beb2" stroke-width="2"/><line x1="588" y1="384" x2="718" y2="384" stroke="#c6beb2" stroke-width="2"/><line x1="588" y1="426" x2="718" y2="426" stroke="#c6beb2" stroke-width="2"/><line x1="588" y1="468" x2="718" y2="468" stroke="#c6beb2" stroke-width="2"/>
    <text x="600" y="552" text-anchor="middle" fill="#7c756b" font-size="16">索引页 · 帮助发现</text>
    <rect x="830" y="160" width="310" height="420" rx="24" fill="#fffdf9" stroke="#d8d1c4"/>
    <rect x="830" y="160" width="310" height="142" rx="24" fill="#2a2825"/><rect x="830" y="278" width="310" height="24" fill="#2a2825"/>
    <text x="985" y="226" text-anchor="middle" fill="#fff" font-family="Noto Serif SC, serif" font-size="28">文章标题</text><text x="985" y="260" text-anchor="middle" fill="#d7d0c7" font-size="14">日期 · 时长 · 分类 · 标签</text>
    <rect x="851" y="326" width="88" height="224" rx="12" fill="#eef3f8"/><text x="895" y="362" text-anchor="middle" fill="#2f526f" font-size="15">目录 42</text><rect x="864" y="386" width="62" height="30" rx="6" fill="#d8e5f0"/><text x="895" y="406" text-anchor="middle" fill="#2f526f" font-size="13">当前章节</text><text x="895" y="446" text-anchor="middle" fill="#6f685f" font-size="13">最近文章</text>
    <line x1="972" y1="344" x2="1108" y2="344" stroke="#b9b1a6" stroke-width="5"/><line x1="972" y1="378" x2="1098" y2="378" stroke="#d0c9bf" stroke-width="2"/><line x1="972" y1="407" x2="1108" y2="407" stroke="#d0c9bf" stroke-width="2"/><line x1="972" y1="436" x2="1090" y2="436" stroke="#d0c9bf" stroke-width="2"/><line x1="972" y1="480" x2="1108" y2="480" stroke="#b9b1a6" stroke-width="4"/><line x1="972" y1="514" x2="1098" y2="514" stroke="#d0c9bf" stroke-width="2"/>
    <text x="985" y="552" text-anchor="middle" fill="#7c756b" font-size="16">文章页 · 连续阅读</text>
  </g>
  <path d="M370 370 H430" stroke="#9b958b" stroke-width="3"/><polygon points="430,359 450,370 430,381" fill="#9b958b"/><path d="M755 370 H815" stroke="#9b958b" stroke-width="3"/><polygon points="815,359 835,370 815,381" fill="#9b958b"/>
  <text x="600" y="630" text-anchor="middle" fill="#7c756b" font-family="Noto Sans SC, Arial, sans-serif" font-size="18">一致来自共同的字体与色彩，差异来自页面任务。</text>
</svg>
