<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a4d8f"/>
      <stop offset="0.45" stop-color="#7fa8d9"/>
      <stop offset="0.72" stop-color="#f5c8a8"/>
      <stop offset="1" stop-color="#ffb98a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1340" cy="700" r="320" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.85" filter="url(#soft)">
    <ellipse cx="420" cy="640" rx="300" ry="70"/>
    <ellipse cx="600" cy="580" rx="220" ry="55"/>
    <ellipse cx="1500" cy="420" rx="260" ry="60"/>
    <ellipse cx="1680" cy="500" rx="180" ry="45"/>
    <ellipse cx="1000" cy="760" rx="380" ry="80"/>
  </g>
  <g fill="#fdeef1" opacity="0.5" filter="url(#soft)">
    <ellipse cx="300" cy="880" rx="420" ry="90"/>
    <ellipse cx="1600" cy="900" rx="360" ry="80"/>
  </g>
</svg>
